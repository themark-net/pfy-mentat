name: pinned-matrix
on: push
jobs:
  dot:
    strategy:
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - run: "true"
  bracket:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
    runs-on: ${{ matrix['os'] }}
    steps:
      - run: "true"
