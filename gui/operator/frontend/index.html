<!DOCTYPE html><html lang=en data-pfy-ui=session><head><meta charset=utf-8/><title>pfy</title>
<style>
body{margin:0;font:14px/1.4 ui-sans-serif,system-ui,sans-serif;background:#0e1116;color:#e8edf4}
.app{display:grid;grid-template-columns:168px 1fr;min-height:100vh}
.side{background:#121821;border-right:1px solid #243041;padding:14px 0}
.side b{display:block;padding:0 16px 12px;font-size:16px}
.side button{display:block;width:calc(100% - 16px);margin:2px 8px;text-align:left;background:#18202c;border:1px solid #334155;color:#e8edf4;padding:10px 12px;border-radius:8px;cursor:pointer}
.side button.on{background:#1e3a5f;border-color:#4d8dff;box-shadow:inset 4px 0 0 #4d8dff;font-weight:700}
.side button:focus-visible{outline:2px solid #4d8dff;outline-offset:2px}
header,.main{padding:10px 16px}
header{border-bottom:1px solid #243041}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;opacity:.9}
.chip{background:#18202c;border:1px solid #243041;border-radius:10px;padding:8px 10px;min-width:140px}
.ready{color:#3dd68c}.partial{color:#e6c15a}.stub{color:#e8875b}.detected-stub{color:#c984f0}.missing{color:#7d8796}.skip{color:#7d8796}.idle{color:#6aa7d9}.READY{color:#3dd68c}.SKIP{color:#7d8796}.FAIL{color:#e8875b}.PASS{color:#3dd68c}
.copy{font-family:ui-monospace,monospace;font-size:12px;background:#111823;padding:4px 6px;border-radius:6px;display:block;margin-top:6px;user-select:all}
button{background:#243041;color:#e8edf4;border:1px solid #3a4a60;border-radius:8px;padding:6px 10px;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:#2a4a6d;border-color:#4d8dff}
input[type=text]{background:#18202c;color:#e8edf4;border:1px solid #3a4a60;border-radius:8px;padding:6px 10px;min-width:180px}
.muted{color:#8b97a8}.live{font-weight:700;text-transform:uppercase;font-size:11px}
.fail{color:#e8875b;font-weight:700}
.view{display:none;padding:16px}.view.on{display:block}
.row{margin:8px 0}
.acts{margin:16px 0;display:flex;flex-wrap:wrap;gap:8px}
.attach-result{display:block;margin-top:8px;font-weight:700}
.attach-result.ok{color:#3dd68c}
.attach-result.fail{color:#e8875b}
a.issue{color:#5c6b7a;font-size:11px;text-decoration:none}
a.issue:hover{text-decoration:underline}
a.hit{display:inline-block;margin-top:6px;background:#2a4a6d;border:1px solid #4d8dff;color:#e8edf4;border-radius:8px;padding:6px 10px;text-decoration:none;cursor:pointer}
a.hit:hover{background:#345a80}
a.inspect{color:#e8edf4;text-decoration:none}
a.inspect .copy{display:inline-block}
noscript .fail{padding:16px;display:block}
</style></head><body>
<noscript><p class=fail>FAIL JS required — pfy harness use grok</p></noscript>
<div class=app>
<nav class=side>
  <b>pfy</b>
  <button type=button class="navbtn on" data-go=loop>Loop</button>
  <button type=button class=navbtn data-go=engine>Engine</button>
  <button type=button class=navbtn data-go=stage>Stage</button>
  <button type=button class=navbtn data-go=attach>Attach</button>
  <button type=button class=navbtn data-go=tools>Tools</button>
  <button type=button class=navbtn id=orgnav data-go=org style=display:none>Org</button>
</nav>
<div class=shell>
<header><b>pfy</b> <span class=muted id=meta>polling...</span></header>
<div class=main>
  <p id=fail class=fail></p>
  <section class="view on" id=view-loop>
    <h2>LOOP</h2>
    <div class=row>env <span id=loop-env class=live>SKIP</span></div>
    <div class=row>attached <b id=loop-attached>(none)</b></div>
    <div class=row>last <b id=loop-last>(none)</b> <span class=muted id=loop-when></span></div>
    <div class=row>monitor <b id=loop-monitor>(none)</b></div>
    <div class=row>grok <span id=loop-grok class=live>missing</span></div>
    <div class=acts>
      <button type=button class=primary id=btnlaunch>Launch env</button>
      <button type=button class=primary id=btnopen>Attach opencode</button>
      <button type=button class=primary id=btngrok>Attach grok</button>
    </div>
    <span id=launchmsg class=attach-result></span>
    <span id=attachmsg class=attach-result></span>
  </section>
PLACEHOLDER_CONTINUE_FROM_DISK
