<!DOCTYPE html><html lang=en data-pfy-ui=session><head><meta charset=utf-8/><title>pfy</title>
<style>
body{margin:0;font:14px/1.4 ui-sans-serif,system-ui,sans-serif;background:#0e1116;color:#e8edf4}
.app{display:grid;grid-template-columns:168px 1fr;min-height:100vh}
.side{background:#121821;border-right:1px solid #243041;padding:14px 0}
.side b{display:block;padding:0 16px 12px;font-size:16px}
.side button{display:block;width:calc(100% - 16px);margin:2px 8px;text-align:left;background:#18202c;border:1px solid #334155;color:#e8edf4;padding:10px 12px;border-radius:8px;cursor:pointer}
.side button.on{background:#1e3a5f;border-color:#4d8dff;box-shadow:inset 4px 0 0 #4d8dff;font-weight:700}
.side button:focus-visible{outline:2px solid #4d8dff;outline-offset:2px}
header,.main{padding:10px 16px}
header{border-bottom:1px solid #243041}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;opacity:.9}
.chip{background:#18202c;border:1px solid #243041;border-radius:10px;padding:8px 10px;min-width:140px}
.ready{color:#3dd68c}.partial{color:#e6c15a}.stub{color:#e8875b}.detected-stub{color:#c984f0}.missing{color:#7d8796}.skip{color:#7d8796}.idle{color:#6aa7d9}.READY{color:#3dd68c}.SKIP{color:#7d8796}.FAIL{color:#e8875b}.PASS{color:#3dd68c}
.copy{font-family:ui-monospace,monospace;font-size:12px;background:#111823;padding:4px 6px;border-radius:6px;display:block;margin-top:6px;user-select:all}
button{background:#243041;color:#e8edf4;border:1px solid #3a4a60;border-radius:8px;padding:6px 10px;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:#2a4a6d;border-color:#4d8dff}
input[type=text]{background:#18202c;color:#e8edf4;border:1px solid #3a4a60;border-radius:8px;padding:6px 10px;min-width:180px}
.muted{color:#8b97a8}.live{font-weight:700;text-transform:uppercase;font-size:11px}
.fail{color:#e8875b;font-weight:700}
.view{display:none;padding:16px}.view.on{display:block}
.row{margin:8px 0}
.acts{margin:16px 0;display:flex;flex-wrap:wrap;gap:8px}
.attach-result{display:block;margin-top:8px;font-weight:700}
.attach-result.ok{color:#3dd68c}
.attach-result.fail{color:#e8875b}
a.issue{color:#5c6b7a;font-size:11px;text-decoration:none}
a.issue:hover{text-decoration:underline}
a.hit{display:inline-block;margin-top:6px;background:#2a4a6d;border:1px solid #4d8dff;color:#e8edf4;border-radius:8px;padding:6px 10px;text-decoration:none;cursor:pointer}
a.hit:hover{background:#345a80}
a.inspect{color:#e8edf4;text-decoration:none}
a.inspect .copy{display:inline-block}
noscript .fail{padding:16px;display:block}
</style></head><body>
<noscript><p class=fail>FAIL JS required — pfy harness use grok</p></noscript>
<div class=app>
<nav class=side>
  <b>pfy</b>
  <button type=button class="navbtn on" data-go=loop>Loop</button>
  <button type=button class=navbtn data-go=engine>Engine</button>
  <button type=button class=navbtn data-go=stage>Stage</button>
  <button type=button class=navbtn data-go=attach>Attach</button>
  <button type=button class=navbtn id=orgnav data-go=org style=display:none>Org</button>
</nav>
<div class=shell>
<header><b>pfy</b> <span class=muted id=meta>polling...</span></header>
<div class=main>
  <p id=fail class=fail></p>
  <section class="view on" id=view-loop>
    <h2>LOOP</h2>
    <div class=row>env <span id=loop-env class=live>SKIP</span></div>
    <div class=row>attached <b id=loop-attached>(none)</b></div>
    <div class=row>last <b id=loop-last>(none)</b> <span class=muted id=loop-when></span></div>
    <div class=row>monitor <b id=loop-monitor>(none)</b></div>
    <div class=row>grok <span id=loop-grok class=live>missing</span></div>
    <div class=acts>
      <button type=button class=primary id=btnlaunch>Launch env</button>
      <button type=button class=primary id=btnopen>Attach opencode</button>
      <button type=button class=primary id=btngrok>Attach grok</button>
    </div>
    <span id=launchmsg class=attach-result></span>
    <span id=attachmsg class=attach-result></span>
  </section>
  <section class=view id=view-engine>
    <h2>ENGINE</h2>
    <div class=row>engine <b id=eng-name>none</b></div>
    <div class=row>live <span id=eng-live class=live>missing</span></div>
    <div class=row>grok <span id=eng-grok class=live>missing</span></div>
    <div class=row>models <span id=eng-models class=muted>(none)</span></div>
    <div class=acts>
      <button type=button class=primary id=btnrefresh>Refresh status</button>
      <button type=button class=primary id=btntest>Test model</button>
    </div>
    <div class=acts>
      <input id=pullname type=text placeholder=model autocomplete=off>
      <button type=button class=primary id=btnpull>Pull</button>
    </div>
    <span id=evalmsg class=attach-result></span>
    <span id=pullmsg class=attach-result></span>
  </section>
  <section class=view id=view-stage>
    <h2>STAGE</h2>
    <div class=row>env-stage <span id=stage-live class=live>SKIP</span></div>
    <div class=acts>
      <button type=button class=primary id=btnstage>Run stage</button>
    </div>
    <span id=stagemsg class=attach-result></span>
  </section>
  <section class=view id=view-attach>
    <h2>ATTACH</h2>
    <div class=row>NOW attached <b id=att-now>(none)</b> · last <b id=att-last>(none)</b></div>
    <div class=chips id=att-rail></div>
    <div class=acts>
      <button type=button class=primary id=att-grok>Attach grok</button>
      <button type=button class=primary id=att-open>Attach opencode</button>
      <button type=button class=primary id=btncopy>Copy stub one-liner</button>
    </div>
    <span id=copymsg class=attach-result></span>
  </section>
  <section class=view id=view-org>
    <h2>ORG</h2>
    <div id=org-body>no org loop</div>
  </section>
</div>
</div>
</div>
<script>
const REFRESH=2000;
const LIVE=new Set(['ready','partial','stub','detected-stub','missing','skip']);
const GROK_USE='pfy harness use grok';
let attachMsg="";
let attachKind="";
let view='loop';
let lastSnap={};
let refreshing=false;
function cls(s){return (s||'').replace(/[^a-z-]/g,'');}
function live(s){s=(s||'').toLowerCase(); return LIVE.has(s)?s:'missing';}
function isTauri(){return !!(window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke);}
function apiRoot(){
  if(isTauri()) return '';
  if(location.protocol==='http:'||location.protocol==='https:') return '';
  return null;
}
function noLiveApi(){ return apiRoot()===null; }
function lastVerbLabel(v){
  v=(v||'').trim();
  if(v==='env'||v==='launch-env') return 'Launch env';
  return v||'(none)';
}
function envLive(s){
  const tape=(s&&s.tape)||[];
  const inf=((tape.find(t=>t.id==='inference')||{}).live||'SKIP')+'';
  const st=((tape.find(t=>t.id==='env-stage')||{}).live||'SKIP')+'';
  const a=[inf,st].map(x=>x.toUpperCase());
  if(a.includes('FAIL')) return 'FAIL';
  if(a.includes('READY')) return 'READY';
  return 'SKIP';
}
function paintEval(text, kind){
  const el=document.getElementById('evalmsg');
  el.textContent=text;
  el.className='attach-result'+(kind?(' '+kind):'');
}
function paintPull(text, kind){
  const el=document.getElementById('pullmsg');
  el.textContent=text;
  el.className='attach-result'+(kind?(' '+kind):'');
}
function paintLaunch(text, kind){
  const el=document.getElementById('launchmsg');
  el.textContent=text;
  el.className='attach-result'+(kind?(' '+kind):'');
}
function paintAttach(){
  const el=document.getElementById('attachmsg');
  el.textContent=attachMsg;
  el.className='attach-result'+(attachKind?(' '+attachKind):'');
}
function paintCopy(text, kind){
  const el=document.getElementById('copymsg');
  el.textContent=text;
  el.className='attach-result'+(kind?(' '+kind):'');
}
function stubLine(s){
  s=s||lastSnap||{};
  if(s.active_stub || s.active==='continue' || s.active==='agent-cage'){
    return s.blocked_copy || GROK_USE;
  }
  const chips=s.chips||[];
  const active=chips.find(c=>c.id===s.active);
  const c=active && ['stub','detected-stub','missing'].includes(live(active.live))
    ? active
    : chips.find(x=>['stub','detected-stub','missing'].includes(live(x.live)) && (x.one_liner||x.startable===false));
  if(!c) return '';
  return c.one_liner || ('./pfy start '+c.id);
}
async function getSnapshot(){
  try{
    if(isTauri()){
      const v=await window.__TAURI__.core.invoke('snapshot');
      return typeof v==='string'?JSON.parse(v):v;
    }
    if(noLiveApi()) return {error:'FAIL',chips:[],tape:[],blocked_copy:GROK_USE};
    const r=await fetch(apiRoot()+'/snapshot',{cache:'no-store'});
    if(!r.ok) throw new Error('snapshot '+r.status);
    return await r.json();
  }catch(e){
    return {error:String(e),chips:[],tape:[],blocked_copy:GROK_USE};
  }
}
async function postStart(id){
  try{
    if(isTauri()){
      const v=await window.__TAURI__.core.invoke('start_sidecar',{id});
      return typeof v==='string'?JSON.parse(v):v;
    }
    if(noLiveApi()) return {ok:false,error:'FAIL',copy:GROK_USE,live:'FAIL'};
    const r=await fetch(apiRoot()+'/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
    try{return await r.json();}catch(e){return {ok:false,error:String(e),copy:GROK_USE,live:'FAIL'};}
  }catch(e){
    return {ok:false,error:String(e),copy:GROK_USE,live:'FAIL'};
  }
}
async function attach(id){
  try{
    const j=await postStart(id);
    if(j && j.ok){
      const kind=(j.role==='monitor')?'monitor':id;
      attachMsg='attached '+kind+(j.pid?(' pid '+j.pid):'');
      attachKind='ok';
    }else{
      attachMsg='FAIL  '+(j && (j.copy||j.error)||GROK_USE);
      attachKind='fail';
    }
  }catch(e){
    attachMsg='FAIL  '+GROK_USE;
    attachKind='fail';
  }
  paintAttach();
  tick();
}
async function refreshNow(){
  const btn=document.getElementById('btnrefresh');
  if(refreshing) return;
  refreshing=true;
  btn.disabled=true;
  document.getElementById('meta').textContent='refreshing…';
  try{
    await tick();
    const ts=(lastSnap&&lastSnap.ts)?lastSnap.ts:'';
    if(!ts) document.getElementById('meta').textContent=(document.getElementById('meta').textContent||'')+' · refreshed';
  }catch(e){
    document.getElementById('fail').textContent='FAIL  '+GROK_USE;
    document.getElementById('meta').textContent='FAIL refresh';
  }finally{
    refreshing=false;
    btn.disabled=false;
  }
}
async function copyText(t){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(t);
      return true;
    }
  }catch(e){}
  try{
    const ta=document.createElement('textarea');
    ta.value=t; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.left='-9999px';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length);
    const ok=document.execCommand('copy');
    ta.remove();
    return !!ok;
  }catch(e){ return false; }
}
async function copyStub(){
  const line=stubLine(lastSnap);
  if(!line){
    paintCopy('FAIL no stub one-liner','fail');
    return;
  }
  const ok=await copyText(line);
  paintCopy(ok?'copied':'FAIL clipboard — select the one-liner', ok?'ok':'fail');
}
function paintStage(text, kind){
  const el=document.getElementById('stagemsg');
  el.textContent=text;
  el.className='attach-result'+(kind?(' '+kind):'');
}
async function postEval(){
  try{
    if(isTauri()){
      try{
        const v=await window.__TAURI__.core.invoke('test_model');
        return typeof v==='string'?JSON.parse(v):v;
      }catch(e){
        return {ok:false,error:String(e),copy:'FAIL eval',live:'FAIL'};
      }
    }
    if(noLiveApi()) return {ok:false,error:'FAIL',copy:'FAIL eval',live:'FAIL'};
    const r=await fetch(apiRoot()+'/eval',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    try{return await r.json();}catch(e){return {ok:false,error:String(e),copy:'FAIL eval',live:'FAIL'};}
  }catch(e){
    return {ok:false,error:String(e),copy:'FAIL eval',live:'FAIL'};
  }
}
async function runEval(){
  const btn=document.getElementById('btntest');
  btn.disabled=true;
  paintEval('testing…','');
  document.getElementById('meta').textContent='refreshing…';
  try{
    const j=await postEval();
    if(j && j.ok){
      const c=j.copy||'PASS eval';
      paintEval(c, c.indexOf('SKIP')===0?'':(c.indexOf('PASS')===0?'ok':''));
    }else{
      paintEval('FAIL '+(j && (j.copy||j.error)||'eval'),'fail');
    }
    await tick();
    const ts=(lastSnap&&lastSnap.ts)?lastSnap.ts:'';
    if(ts) document.getElementById('meta').textContent=[lastSnap.host,lastSnap.profile,ts].filter(Boolean).join(' · ');
  }catch(e){
    paintEval('FAIL eval','fail');
  }finally{
    btn.disabled=false;
  }
}
async function postPull(name){
  try{
    if(isTauri()){
      try{
        const v=await window.__TAURI__.core.invoke('pull_model',{name});
        return typeof v==='string'?JSON.parse(v):v;
      }catch(e){
        return {ok:false,error:String(e),copy:'FAIL pull',live:'FAIL'};
      }
    }
    if(noLiveApi()) return {ok:false,error:'FAIL',copy:'FAIL pull',live:'FAIL'};
    const r=await fetch(apiRoot()+'/models/pull',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
    try{return await r.json();}catch(e){return {ok:false,error:String(e),copy:'FAIL pull',live:'FAIL'};}
  }catch(e){
    return {ok:false,error:String(e),copy:'FAIL pull',live:'FAIL'};
  }
}
async function runPull(){
  const btn=document.getElementById('btnpull');
  const name=(document.getElementById('pullname').value||'').trim();
  if(!name){
    paintPull('FAIL pull','fail');
    return;
  }
  btn.disabled=true;
  paintPull('pulling…','');
  document.getElementById('meta').textContent='refreshing…';
  try{
    const j=await postPull(name);
    if(j && j.ok){
      const c=j.copy||'PASS pull';
      paintPull(c, c.indexOf('SKIP')===0?'':'ok');
    }else{
      paintPull('FAIL '+(j && (j.copy||j.error)||'pull'),'fail');
    }
    await tick();
    const ts=(lastSnap&&lastSnap.ts)?lastSnap.ts:'';
    if(ts) document.getElementById('meta').textContent=[lastSnap.host,lastSnap.profile,ts].filter(Boolean).join(' · ');
  }catch(e){
    paintPull('FAIL pull','fail');
  }finally{
    btn.disabled=false;
  }
}
async function postEnv(){
  try{
    if(isTauri()){
      try{
        const v=await window.__TAURI__.core.invoke('launch_env');
        return typeof v==='string'?JSON.parse(v):v;
      }catch(e){
        return {ok:false,error:String(e),copy:'FAIL env',live:'FAIL'};
      }
    }
    if(noLiveApi()) return {ok:false,error:'FAIL',copy:'FAIL env',live:'FAIL'};
    const r=await fetch(apiRoot()+'/env',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    try{return await r.json();}catch(e){return {ok:false,error:String(e),copy:'FAIL env',live:'FAIL'};}
  }catch(e){
    return {ok:false,error:String(e),copy:'FAIL env',live:'FAIL'};
  }
}
async function runEnv(){
  const btn=document.getElementById('btnlaunch');
  btn.disabled=true;
  paintLaunch('launching env…','');
  document.getElementById('meta').textContent='refreshing…';
  try{
    const j=await postEnv();
    if(j && j.ok){
      paintLaunch(j.copy||'PASS env','ok');
    }else{
      paintLaunch('FAIL '+(j && (j.copy||j.error)||'env'),'fail');
    }
    await tick();
    const ts=(lastSnap&&lastSnap.ts)?lastSnap.ts:'';
    if(ts) document.getElementById('meta').textContent=[lastSnap.host,lastSnap.profile,ts].filter(Boolean).join(' · ');
  }catch(e){
    paintLaunch('FAIL env','fail');
    document.getElementById('fail').textContent='FAIL  env';
  }finally{
    btn.disabled=false;
  }
}
async function postStage(){
  try{
    if(isTauri()){
      try{
        const v=await window.__TAURI__.core.invoke('run_stage');
        return typeof v==='string'?JSON.parse(v):v;
      }catch(e){
        return {ok:false,error:String(e),copy:'FAIL env-stage',live:'FAIL'};
      }
    }
    if(noLiveApi()) return {ok:false,error:'FAIL',copy:'FAIL env-stage',live:'FAIL'};
    const r=await fetch(apiRoot()+'/stage',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    try{return await r.json();}catch(e){return {ok:false,error:String(e),copy:'FAIL env-stage',live:'FAIL'};}
  }catch(e){
    return {ok:false,error:String(e),copy:'FAIL env-stage',live:'FAIL'};
  }
}
async function runStage(){
  const btn=document.getElementById('btnstage');
  btn.disabled=true;
  paintStage('running env-stage…','');
  document.getElementById('meta').textContent='refreshing…';
  try{
    const j=await postStage();
    if(j && j.ok){
      paintStage(j.copy||'PASS env-stage','ok');
    }else{
      paintStage('FAIL '+(j && (j.copy||j.error)||'env-stage'),'fail');
    }
    await tick();
    const ts=(lastSnap&&lastSnap.ts)?lastSnap.ts:'';
    if(ts) document.getElementById('meta').textContent=[lastSnap.host,lastSnap.profile,ts].filter(Boolean).join(' · ');
  }catch(e){
    paintStage('FAIL env-stage','fail');
    document.getElementById('fail').textContent='FAIL  env-stage';
  }finally{
    btn.disabled=false;
  }
}
function show(v){
  view=v;
  document.querySelectorAll('.view').forEach(el=>el.classList.toggle('on', el.id==='view-'+v));
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('on', b.dataset.go===v));
}
document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>show(b.dataset.go)));
function bindAttach(id, hid){
  const el=document.getElementById(id);
  if(el) el.addEventListener('click',()=>attach(hid));
}
bindAttach('btngrok','grok');
bindAttach('btnopen','opencode');
bindAttach('att-grok','grok');
bindAttach('att-open','opencode');
document.getElementById('btnrefresh').addEventListener('click',()=>refreshNow());
document.getElementById('btncopy').addEventListener('click',()=>copyStub());
document.getElementById('btnstage').addEventListener('click',()=>runStage());
document.getElementById('btnlaunch').addEventListener('click',()=>runEnv());
document.getElementById('btnpull').addEventListener('click',()=>runPull());
document.getElementById('btntest').addEventListener('click',()=>runEval());
function chipHtml(c){
  const lv=live(c.live);
  return '<div class=chip><b>'+c.id+'</b> <span class="live '+cls(lv)+'">'+lv+'</span><div class=muted>'+c.role+' · '+c.name+'</div></div>';
}
function setLive(id, val){
  const el=document.getElementById(id);
  const lv=live(val);
  el.textContent=lv;
  el.className='live '+cls(lv);
}
async function tick(){
  try{
    const s=await getSnapshot();
    lastSnap=s||{};
    if(s.error && !(s.chips||[]).length){
      document.getElementById('meta').textContent=s.error;
      document.getElementById('fail').textContent='FAIL  '+(s.blocked_copy||GROK_USE);
      attachMsg=attachMsg||('FAIL  '+(s.blocked_copy||GROK_USE));
      attachKind='fail';
      paintAttach();
      return;
    }
    document.getElementById('meta').textContent=[s.host,s.profile,s.ts].filter(Boolean).join(' · ');
    const d=s.detector||{}, r=s.status_runtime||{};
    const engLive=live(s.engine_live||d.status||'missing');
    const g=(s.chips||[]).find(c=>c.id==='grok')||{};
    const stub=!!(s.active_stub || s.active==='continue' || s.active==='agent-cage');
    ['btngrok','btnopen','att-grok','att-open'].forEach(id=>{
      const el=document.getElementById(id);
      if(el) el.disabled=stub;
    });
    document.getElementById('fail').textContent=stub?('FAIL  '+(s.blocked_copy||GROK_USE)):'';
    if(!attachMsg && stub){ attachMsg='FAIL  '+(s.blocked_copy||GROK_USE); attachKind='fail'; }
    paintAttach();
    const showOrg=!s.agent_lane_collapsed && (s.org_messages||[]).length;
    document.getElementById('orgnav').style.display=showOrg?'block':'none';
    if(!showOrg && view==='org') show('loop');
    const attached=s.active||'(none)';
    const verb=lastVerbLabel((s.last_verb&&s.last_verb.verb)||'(none)');
    const when=(s.last_verb&&s.last_verb.when)||'';
    const pid=s.sidecar_pid || '';
    document.getElementById('loop-attached').textContent=attached+(pid?(' pid '+pid):'');
    document.getElementById('loop-last').textContent=verb;
    const elv=envLive(s);
    const envEl=document.getElementById('loop-env');
    envEl.textContent=elv;
    envEl.className='live '+cls(elv.toLowerCase());
    document.getElementById('loop-when').textContent=when;
    const mon=document.getElementById('loop-monitor');
    if(mon){
      const note=s.monitor_note||'';
      const mpid=s.monitor_pid||'';
      mon.textContent=note||(mpid?('pid '+mpid):'(none)');
    }
    const gpath=s.grok_path||g.live||'missing';
    const gEl=document.getElementById('loop-grok');
    if(gEl) setLive('loop-grok', gpath);
    document.getElementById('eng-name').textContent=d.engine||r.engine||'none';
    setLive('eng-live', engLive);
    setLive('eng-grok', g.live);
    const models=s.models||[];
    document.getElementById('eng-models').textContent=models.length?models.join(' · '):'(none)';
    const tape=s.tape||[];
    const stage=tape.find(t=>t.id==='env-stage'||t.label==='env-stage')||{};
    const sl=stage.live||'SKIP';
    const stageEl=document.getElementById('stage-live');
    stageEl.textContent=sl;
    stageEl.className='live '+cls((sl||'').toLowerCase());
    document.getElementById('att-now').textContent=attached;
    document.getElementById('att-last').textContent=verb;
    document.getElementById('att-rail').innerHTML=(s.chips||[]).map(chipHtml).join('');
    document.querySelectorAll('[data-start]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();attach(el.getAttribute('data-start'));}));
    document.querySelectorAll('a.inspect').forEach(el=>el.addEventListener('click',e=>{e.preventDefault(); const t=el.textContent||''; if(t){ copyText(t).then(ok=>paintCopy(ok?'copied':'FAIL clipboard — select the one-liner', ok?'ok':'fail')); } else { paintCopy('FAIL no stub one-liner','fail'); }}));
    if(showOrg){
      const rows=(s.org_messages||[]).map(m=>'<tr><td>'+m.from+' → '+m.to+'</td><td>'+(m.pr||m.issue||'')+'</td><td>'+(m.state||'')+'</td></tr>').join('');
      document.getElementById('org-body').innerHTML='<table>'+rows+'</table>';
    } else {
      document.getElementById('org-body').textContent='no org loop';
    }
  }catch(e){
    document.getElementById('fail').textContent='FAIL  '+GROK_USE;
    attachMsg='FAIL  '+GROK_USE;
    attachKind='fail';
    paintAttach();
  }
}
tick(); setInterval(tick, REFRESH);
</script></body></html>
