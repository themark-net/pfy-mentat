# Creative use of nimo: implement-lane matrix against local Ollama models.
name: nightly-models

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Comma-separated Ollama models (empty = auto from host tags)"
        required: false
        default: ""
  schedule:
    - cron: "0 7 * * *"

jobs:
  matrix:
    runs-on: [self-hosted, Linux, X64, pfy-mentat]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Probe Ollama
        id: ollama
        run: |
          if curl -sf --max-time 3 http://127.0.0.1:11434/api/tags >/dev/null; then
            echo "up=true" >> "$GITHUB_OUTPUT"
            curl -sf http://127.0.0.1:11434/api/tags | python3 -c "import sys,json; d=json.load(sys.stdin); print('models=', ','.join(m['name'] for m in d.get('models',[])[:20]))"
          else
            echo "up=false" >> "$GITHUB_OUTPUT"
            mkdir -p pipelines/eval
            echo "# nightly-models SKIP — Ollama down" > pipelines/eval/nightly-models.latest.md
          fi

      - name: Select models + run suite
        if: steps.ollama.outputs.up == 'true'
        env:
          EVAL_MODELS: ${{ github.event.inputs.models }}
          # Host runner: LiteLLM/Ollama gateway on nimo (not in-cage DNS)
          OPENAI_BASE_URL: http://127.0.0.1:11435/v1
        run: |
          set -euo pipefail
          mkdir -p pipelines/eval
          MODELS=$(python3 scripts/nightly_pick_models.py)
          if [[ -z "$MODELS" ]]; then
            echo "no models picked" > pipelines/eval/nightly-models.latest.md
            exit 0
          fi
          GATE="${MODELS%%,*}"
          echo "MODELS=$MODELS GATE=$GATE"
          ./examples/litellm-ollama/host-ollama-gateway.sh start 2>/dev/null || true
          TASKS="001-is-palindrome,002-fix-sum-evens,011-fizzbuzz,012-slugify"
          set +e
          python3 examples/eval-harness/run_suite.py \
            --tasks "$TASKS" \
            --models "$MODELS" \
            --gate-model "$GATE" \
            --matrix-md pipelines/eval/nightly-models.latest.md
          rc=$?
          set -e
          echo "" >> pipelines/eval/nightly-models.latest.md
          echo "suite_exit=$rc event=${GITHUB_EVENT_NAME} models=$MODELS" >> pipelines/eval/nightly-models.latest.md
          exit 0

      - name: Upload matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-models-${{ github.run_id }}
          path: pipelines/eval/nightly-models.latest.md
          if-no-files-found: ignore
