# G0 gates — no LLM required. Runs on GitHub-hosted AND self-hosted (nimo) when online.
name: eval-structural

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  structural-github:
    name: G0 (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Structural + golden
        run: |
          python3 examples/eval-harness/run_structural.py --write-md pipelines/eval/structural.latest.md
          python3 examples/eval-harness/run_golden.py --write-md pipelines/eval/golden.latest.md
      - name: Launcher must exec
        run: |
          set -euo pipefail
          git ls-files -s -- pfy scripts/pfy
          test -x pfy
          test -x scripts/pfy
          ./pfy help
      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-github-${{ github.run_id }}
          path: |
            pipelines/eval/structural.latest.md
            pipelines/eval/golden.latest.md
          if-no-files-found: ignore

  structural-local:
    name: G0 (self-hosted nimo)
    runs-on: [self-hosted, Linux, X64, pfy-mentat]
    # Don't block PR merge if lab machine is offline
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Structural + golden + catalog receipts
        run: |
          set -euo pipefail
          python3 examples/eval-harness/run_structural.py --write-md pipelines/eval/structural.latest.md
          python3 examples/eval-harness/run_golden.py --write-md pipelines/eval/golden.latest.md
          python3 scripts/catalog_dashboard.py
          python3 scripts/catalog_check.py
          python3 scripts/smoke_contract_lint.py
      - name: Launcher must exec
        run: |
          set -euo pipefail
          git ls-files -s -- pfy scripts/pfy
          test -x pfy
          test -x scripts/pfy
          ./pfy help
      - name: Upload local receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-local-${{ github.run_id }}
          path: |
            pipelines/eval/*.md
            pipelines/catalog/*.md
          if-no-files-found: ignore
