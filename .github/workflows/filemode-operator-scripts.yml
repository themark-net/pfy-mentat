# Optional git filemode 100755 for operator launchers.
# Contents API writes 100644. Run manually after a Contents-API push of launchers.
# Not on push: a prior run committed an empty scripts/pfy blob.
name: operator-launch-filemode

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chmod-launchers:
    name: git filemode 100755
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: git update-index --chmod=+x (no-op if already 100755)
        run: |
          set -euo pipefail
          paths=(
            pfy
            scripts/pfy
            scripts/pfy-gui.py
            scripts/pfy-board.py
            scripts/detect-local-runtime.sh
            scripts/env-stage.sh
          )
          need=0
          for p in "${paths[@]}"; do
            [[ -e "$p" ]] || { echo "missing $p"; exit 1; }
            [[ -s "$p" ]] || { echo "refusing empty $p"; exit 1; }
            mode="$(git ls-files -s -- "$p" | awk '{print $1}')"
            echo "$p mode=$mode size=$(wc -c < "$p")"
            if [[ "$mode" != "100755" ]]; then
              git update-index --chmod=+x -- "$p"
              need=1
            fi
          done
          git ls-files -s -- "${paths[@]}"
          if [[ "$need" -eq 0 ]]; then
            echo "already 100755; no-op"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(pfy): git filemode 100755 on operator launchers"
          git push
